    <!-- Service Worker: unregister all old SWs first, then register fresh -->
    <script>
      if ('serviceWorker' in navigator) {
        const host = window.location.hostname;
        const isLocalDev = host === 'localhost' || host === '127.0.0.1';

        window.addEventListener('load', function() {
          // Always unregister old service workers first
          // This prevents stale cached JS assets (old hashes) from causing 404s
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            var unregPromises = regs
              .filter(function(reg) {
                // Only unregister if it's NOT our current sw.js
                return !reg.active || !reg.active.scriptURL.endsWith('/sw.js');
              })
              .map(function(reg) { return reg.unregister(); });

            return Promise.all(unregPromises);
          }).then(function() {
            if (isLocalDev) return;
            // Register fresh SW after clearing old ones
            navigator.serviceWorker.register('/sw.js')
              .then(function(reg) {
                console.log('SW registered:', reg.scope);
                // Force new SW to activate immediately (skip waiting)
                if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              })
              .catch(function(err) { console.log('SW registration failed:', err); });
          });
        });
      }
    </script>
